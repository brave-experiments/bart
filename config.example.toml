# Optional defaults. Copy to config.toml only if no local file already exists.
# Replace or omit workspace paths; relative paths resolve from the config file.

[workspace]
brave_core_dir = "/absolute/path/to/src/brave"
work_dir = "/absolute/path/to/bart-work"

# Development: both outputs go to BART issues; PR output is a preview.
[publication.qa]
repository = "brave-experiments/bart"
destination = "issue"

[publication.pr]
repository = "brave-experiments/bart"
destination = "issue"
